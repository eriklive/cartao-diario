<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      Política de segurança também em <meta>: hospedagens sem cabeçalhos próprios (GitHub Pages)
      ficam protegidas igual. Onde dá para mandar cabeçalhos, public/_headers repete a política
      e acrescenta frame-ancestors, que não funciona em <meta>.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'"
    />
    <title>Cartão Diário</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Cartão Diário da Terapia Comportamental Dialética: registre impulsos e habilidades um dia de cada vez. Os dados ficam só no seu celular."
    />
    <meta name="theme-color" content="#F2F4F7" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cartão Diário" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <cd-root></cd-root>
    <noscript>O Cartão Diário precisa de JavaScript ativado.</noscript>
  </body>
</html>
